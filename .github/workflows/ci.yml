name: CI

on:
  # No tag trigger: releases come only from release.yml, which adds the devicon
  # font. A hand-pushed tag would publish a release without it.
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch devicon font
        env:
          GITHUB_TOKEN: ${{ github.token }}  # avoids the anonymous API rate limit
        run: make fonts

      - name: Toolchain versions
        run: swift --version

      - name: Format check
        run: make format-check

      - name: Test
        run: make test

      - name: Build and test demo
        run: make demo-test
